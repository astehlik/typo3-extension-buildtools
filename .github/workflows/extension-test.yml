---
name: Testing and linting

on:
  workflow_call:
    inputs:
      php-version-main:
        description: 'Main PHP version'
        required: false
        default: '8.4'
        type: string
      php-version-min:
        description: 'Minimal PHP version'
        required: false
        default: '8.2'
        type: string
      php-versions:
        description: 'JSON encoded array of PHP versions'
        required: false
        default: '["8.2", "8.3", "8.4", "8.5"]'
        type: string
    secrets:
      CC_TEST_REPORTER_ID:
        description: 'Code Climate Test Reporter ID'
        required: false

jobs:
  'composer-validate':
    name: 'Composer validate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: '${{ inputs.php-version-main }}'
      - run: composer t3:check:composer:validate

  'composer-normalize':
    name: 'Composer normalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: '${{ inputs.php-version-main }}'
      - run: composer t3:check:composer:normalize

  'check-codestyle-codesniffer':
    name: 'PHP_CodeSniffer check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: '${{ inputs.php-version-main }}'
      - run: composer t3:check:php:cs

  'check-codestyle-php-cs-fixer':
    name: 'PHP CS Fixer check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: '${{ inputs.php-version-min }}'
      - run: composer t3:check:php:cgl

  'php-unit-tests':
    name: 'PHP Unit tests'
    strategy:
      matrix:
        php_version: ${{ fromJson(inputs.php-versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: ${{ matrix.php_version }}
      - run: |
          bash bin/t3_run_tests.sh -s unit -p ${MATRIX_PHP_VERSION}
        env:
          MATRIX_PHP_VERSION: ${{ matrix.php_version }}

  'php-functional-tests-sqlite':
    name: 'Functional tests on SQLite'
    strategy:
      matrix:
        php_version: ${{ fromJson(inputs.php-versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: '${{ matrix.php_version }}'
      - run: |
          bash bin/t3_run_tests.sh -s functional -d sqlite -p ${MATRIX_PHP_VERSION}
        env:
          MATRIX_PHP_VERSION: ${{ matrix.php_version }}

  'php-functional-tests-mariadb-main':
    name: 'Functional tests on MariaDB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: ${{ inputs.php-version-main }}
      - run: |
          bash bin/t3_run_tests.sh -s functional -d mariadb -b docker -p ${INPUTS_PHP_VERSION_MAIN}
        env:
          INPUTS_PHP_VERSION_MAIN: ${{ inputs.php-version-main }}

  'php-acceptance-tests-mariadb':
    name: 'Acceptance tests on MariaDB'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
      - run: |
          rm -f .Build/Web/typo3/sysext/* .Build/Web/typo3conf/ext/*
          composer run post-autoload-dump
          test ! -f Tests/codeception.yml && echo "Skipping acceptance tests" || bash bin/t3_run_tests.sh -s acceptance -d mariadb -b docker -p ${INPUTS_PHP_VERSION_MAIN} -b docker
        env:
          INPUTS_PHP_VERSION_MAIN: ${{ inputs.php-version-main }}

  'php-lint':
    name: 'PHP linting'
    strategy:
      matrix:
        php_version: ${{ fromJson(inputs.php-versions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: ${{ matrix.php_version }}
      - run: |
          bash bin/t3_run_tests.sh -s lintPhp -p ${MATRIX_PHP_VERSION}
        env:
          MATRIX_PHP_VERSION: ${{ matrix.php_version }}

  'phpstan':
    name: 'PHPStan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: '${{ inputs.php-version-main }}'
      - run: |
          test ! -f Tests/codeception.yml && echo "Skipping codeception build" || php bin/codecept build -c Tests/codeception.yml
          bash bin/t3_run_tests.sh -s phpstan -p ${INPUTS_PHP_VERSION_MAIN}
        env:
          INPUTS_PHP_VERSION_MAIN: ${{ inputs.php-version-main }}

  'typo3-scan':
    name: 'Scan for deprecated and breaking code using typo3scan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astehlik/typo3-extension-buildtools/actions/composer@TYPO3_14 # zizmor: ignore[unpinned-uses] intentionally tracks this branch so consumers get composer-action updates automatically
        with:
          php_version: '${{ inputs.php-version-main }}'
      - run: composer t3:check:typo3:scan --force
